# ==========================================
# Nginx 配置 - 反向代理到 Node.js 服务
# 放置到 /etc/nginx/sites-available/alumni
# 然后 ln -s /etc/nginx/sites-available/alumni /etc/nginx/sites-enabled/
# ==========================================

server {
    listen 80;
    server_name xixixiaoyou.online www.xixixiaoyou.online;

    # 申请 SSL 证书后启用 HTTPS
    # listen 443 ssl;
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 20m;  # 允许大文件上传

    # API 反向代理到 Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如需）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 静态文件（上传的图片）
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 根路径显示 API 信息
    location / {
        return 200 '{"name":"alumni-server","status":"running"}';
        add_header Content-Type application/json;
    }
}
